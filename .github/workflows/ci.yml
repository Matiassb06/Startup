name: Train-to-Hire CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════
  # BACKEND — Tests + Lint
  # ═══════════════════════════════════════
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite://"
      JWT_SECRET: "ci-test-secret"
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRATION_MINUTES: "30"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: python -m pytest test_auth.py test_student.py test_company.py test_admin.py -v --tb=short

  # ═══════════════════════════════════════
  # FRONTEND — Build check
  # ═══════════════════════════════════════
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: ""

  # ═══════════════════════════════════════
  # DOCKER — Build check
  # ═══════════════════════════════════════
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t traintohire-backend ./backend

      - name: Build frontend image
        run: docker build -t traintohire-frontend ./frontend
